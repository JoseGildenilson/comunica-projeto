services:
  postgres:
    image: postgres:16-alpine
    container_name: internal_management_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-internal_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-internal_management}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: internal_management_backend_prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/internal_management}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-1234567890}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: internal_management_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PROD_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - internal-net

volumes:
  postgres_prod_data:
    name: internal_management_postgres_prod_data

networks:
  internal-net:
    name: internal_management_net_prod
    driver: bridge
