name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - master

jobs:
  backend-tests:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_internal_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_internal_management
      SECRET_KEY: ci-test-secret-key-that-is-at-least-32-characters-long

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run Database Migrations
        run: |
          uv run alembic upgrade head

      - name: Run Backend Tests with Coverage
        run: |
          PYTHONPATH=. uv run pytest --cov=src --cov-branch --cov-report=term-missing

  frontend-tests:
    name: Frontend Tests & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm test -- --run
